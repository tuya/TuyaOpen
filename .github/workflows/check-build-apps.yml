name: TuyaOpen Check Build
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  pull_request:
    branches:
      - master  # 当分支有提交时执行此工作流
      - dev
      - xb/tuyaopen-jl
jobs:
  Check-Build-Apps:
    runs-on: self-hosted
    env:
      OPEN_COUNTRY_CODE: "NONE"
      BUILD_LOG_BASE: ${{ github.workspace }}/tmp/logs/build_logs_${{ github.run_number }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          show-progress: false
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 Running on a ${{ runner.os }}, branch is ${{ github.ref }} !"
      - name: Check Base Tools
        run: |
          echo "::group::Checking base tools"
          cd ${{ github.workspace }}
          . ./export.sh
          tos.py version
          tos.py check
          rm -rf ${{ github.workspace }}/dist
          echo "::endgroup::"
      - name: Copy cache
        run: |
          echo "::group::Copying cache"
          SCRIPT_PATH="${{ github.workspace }}/../../../.tuyaopen/platform_cache_copy.py"
          cd ${{ github.workspace }}
          . ./export.sh
          if [ -f "$SCRIPT_PATH" ]; then
            $SCRIPT_PATH --output "${{ github.workspace }}/platform"
            tos.py update
          else
            echo "Cache copy script not found, skip: $SCRIPT_PATH"
          fi
          echo "::endgroup::"
      - name: Prepare JieLi platform for tests
        run: |
          cd ${{ github.workspace }}
          . ./export.sh
          mkdir -p .cache
          touch .cache/.dont_prompt_update_platform
          "$OPEN_SDK_PYTHON" - <<'PY'
          import logging
          import os

          from tools.cli_command.cli_build import download_platform, get_platform_info
          from tools.cli_command.util import get_global_params, set_global_params, set_logger
          from tools.cli_command.util_git import git_checkout

          set_logger(logging.INFO)
          set_global_params()
          info = get_platform_info("JIELI")
          if not info or not download_platform("JIELI"):
              raise SystemExit("Could not prepare the JieLi platform checkout")
          platform_root = os.path.join(get_global_params()["platforms_root"], "JIELI")
          if not git_checkout(platform_root, info["commit"]):
              raise SystemExit("Could not check out the pinned JieLi platform commit")
          PY
      - name: Run JieLi platform tests
        run: |
          cd ${{ github.workspace }}
          . ./export.sh
          "$OPEN_SDK_PYTHON" -m unittest discover -s tests/platform -t . -p 'test_jieli_*.py'
      - name: Check [switch_demo] Build
        env:
          BUILD_LOG_DIR: ${{ env.BUILD_LOG_BASE }}/switch_demo
        run: |
          echo "::group::Building switch_demo"
          cd ${{ github.workspace }}
          . ./export.sh
          cd ${{ github.workspace }}/apps/tuya_cloud/switch_demo
          tos.py dev bac -d ${{ github.workspace }}/dist -o "$BUILD_LOG_DIR"
          echo "::endgroup::"
      - name: Check [your_chat_bot] Build
        env:
          BUILD_LOG_DIR: ${{ env.BUILD_LOG_BASE }}/your_chat_bot
        run: |
          echo "::group::Building your_chat_bot"
          cd ${{ github.workspace }}
          . ./export.sh
          cd ${{ github.workspace }}/apps/tuya.ai/your_chat_bot
          tos.py dev bac -d ${{ github.workspace }}/dist -o "$BUILD_LOG_DIR"
          echo "::endgroup::"
      - name: Check [your_otto_robot] Build
        env:
          BUILD_LOG_DIR: ${{ env.BUILD_LOG_BASE }}/your_otto_robot
        run: |
          echo "::group::Building your_otto_robot"
          cd ${{ github.workspace }}
          . ./export.sh
          cd ${{ github.workspace }}/apps/tuya.ai/your_otto_robot
          tos.py dev bac -d ${{ github.workspace }}/dist -o "$BUILD_LOG_DIR"
          echo "::endgroup::"
      - name: Check [ipc_p2p_demo] Build
        env:
          BUILD_LOG_DIR: ${{ env.BUILD_LOG_BASE }}/ipc_p2p_demo
        run: |
          echo "::group::Building ipc_p2p_demo"
          cd ${{ github.workspace }}
          . ./export.sh
          cd ${{ github.workspace }}/apps/tuya_cloud/ipc_p2p_demo
          tos.py dev bac -d ${{ github.workspace }}/dist -o "$BUILD_LOG_DIR"
          echo "::endgroup::"
      - name: Check [weather_get_demo] Build
        env:
          BUILD_LOG_DIR: ${{ env.BUILD_LOG_BASE }}/weather_get_demo
        run: |
          echo "::group::Building weather_get_demo"
          cd ${{ github.workspace }}
          . ./export.sh
          cd ${{ github.workspace }}/apps/tuya_cloud/weather_get_demo
          tos.py dev bac -d ${{ github.workspace }}/dist -o "$BUILD_LOG_DIR"
          echo "::endgroup::"
      - name: Set timestamp
        id: timestamp
        if: always()
        run: echo "timestamp=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT
      - name: Upload Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build_logs_${{ github.run_number }}_${{ steps.timestamp.outputs.timestamp }}
          path: ${{ env.BUILD_LOG_BASE }}
          retention-days: 90
          if-no-files-found: warn