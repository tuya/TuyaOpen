name: TuyaOpen CI - PR Review
# Maintainer authorization comes only from the service configuration.
# Command prefix is case-insensitive; do not trim the body or accept line breaks.
# The service uses the same format and reports malformed command attempts in English.
run-name: >-
  ${{ github.event_name == 'issue_comment' &&
      (github.event.comment.user.type == 'Bot' &&
       format('Skipped comment - #{0}: bot comments are ignored', github.event.issue.number) ||
       (startsWith(github.event.comment.body, '/build ') &&
        !contains(github.event.comment.body, fromJSON('"\n"')) &&
        !contains(github.event.comment.body, fromJSON('"\r"'))) &&
       format('Build request - PR #{0}', github.event.issue.number) ||
       format('issue_comment #{0}', github.event.issue.number)) ||
      format('{0} #{1}', github.event_name, github.event.number || github.event.issue.number || github.run_id) }}

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, edited, closed, converted_to_draft, ready_for_review]
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  review:
    if: >-
      github.repository == 'tuya/TuyaOpen' && github.ref == 'refs/heads/master' &&
      (github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot')
    runs-on: [tuyaopen-ci-events, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Review, validate commands and hand over
        id: build
        shell: bash
        run: python /app/infra/build/actions_event.py
