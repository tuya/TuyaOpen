# LCKFB K230 flash config (platform_flash_bridge.py reads this).
# Flashing is over USB BootROM (VID 29f1 / PID 0230) via k230_flash_py.
#   macOS prereq: brew install libusb ; put board in BootROM mode (hold BOOT + power).
CONFIG_FLASH_DEVICE=K230
CONFIG_FLASH_MEDIA=EMMC
CONFIG_FLASH_BAUDRATE=115200
CONFIG_FLASH_REQUIRE_PORT=n
# tos.py flash mode: full = flash entire .kdimg (build_sdk.sh output);
#                     app  = deploy just the app ELF (no full reflash).
CONFIG_FLASH_MODE=app
# app-mode transport: sd = copy ELF to /sdcard/app/ on the SD card;
#                     partition = flash only the 'app' partition via USB BootROM.
CONFIG_FLASH_APP_MODE=sd
